[project]
name = "wanna"
version = "0.9.4"
description = "wanna.sh: run any AI model locally. Chat, images, video, speech and more."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28",
    "huggingface_hub>=2.3",
    "nvidia-ml-py>=13.0",
    "pydantic>=2.10",
    "python-multipart>=0.0.20",
    "psutil>=6.0",
    "pypdf>=5.0",
    "numpy",  # document search (knowledge libraries)
    "scikit-learn>=1.5",  # your own tasks: trees for tables, and what learns from search-model vectors
    "pillow",  # reading and saving pictures for GGUF picture models (stable-diffusion.cpp), which need no PyTorch
]

[project.optional-dependencies]
# Everything needed to run image, video, speech, transcription and music models.
ml = [
    "torch>=2.6",
    "torchvision",
    "diffusers>=0.42",
    "transformers>=5.0",
    "accelerate>=1.10",
    "safetensors",
    "sentencepiece",
    "protobuf",
    "soundfile>=0.13",
    "imageio[ffmpeg]",
    "pillow",
    "numpy",
    "scipy",
    "librosa",
    "ftfy",
    "peft>=0.17",  # training your own picture styles and chat models (LoRA)
    "bitsandbytes>=0.49; sys_platform != 'darwin'",  # training chat models too big for the graphics card in 4 bits
]

[project.scripts]
wanna = "wanna.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wanna"]
