# Weekly dependency updates as pull requests, grouped per ecosystem so they arrive as a few PRs, not dozens.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend: { patterns: ["*"] }
    # Major versions (TypeScript, ESLint, ...) need the Next.js/Astro tooling to support them first: update by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups:
      site: { patterns: ["*"] }
    # Major versions (TypeScript, ESLint, ...) need the Next.js/Astro tooling to support them first: update by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    # Requirements are open-ended (">="), so installs already get new versions. Only change one when a new version
    # falls outside it.
    versioning-strategy: increase-if-necessary
    groups:
      backend: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    # Base images stay on long-term-support lines (Ubuntu 24.04, Node 24); move those by hand when it's time.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
