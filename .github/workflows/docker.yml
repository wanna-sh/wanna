# Builds the wanna.sh image and publishes it to GitHub Container Registry (ghcr.io/wanna-sh/wanna).
# Runs when a version tag (v1.2.3) is pushed, or by hand from the Actions tab. Not on every push: the full image
# is about 7 GB unpacked.
#
# Tags: latest, 1.2.3, 1.2 (everything) and latest-chat, 1.2.3-chat, 1.2-chat (chat and Code only).
# The first time, make the package public under the repository's Packages if you want anyone to pull it.
name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: full
            with_ml: "1"
            suffix: ""
          - variant: chat
            with_ml: "0"
            suffix: "-chat"
    steps:
      # PyTorch with CUDA makes the full image large; the runner needs the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: WITH_ML=${{ matrix.with_ml }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
